<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Git Visualizer</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts); light by default.
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem('tgv:theme')) === 'dark' ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
